spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_rag_assistant}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET ivfflat.probes = 10

  jpa:
    show-sql: false   # 🔥 disables SQL printing
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  ai:
    otel:
      tracing:
        enabled: false
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1

# =========================
# LLM Provider, vllm, openai, claude
# =========================
llm:
  provider: ${LLM_PROVIDER:triton-vllm}   # triton-vllm (Nemotron on Triton) | vllm (Qwen rollback)

  vllm:
    base-url: http://localhost:8001
    model: cyankiwi/Qwen3-30B-A3B-Instruct-2507-AWQ-4bit   # was meta-llama/Meta-Llama-3.1-8B-Instruct
    temperature: 0.1   # low = repeatable RAG answers (vLLM default is 1.0)

  triton:
    # Nemotron-3-Nano-30B-A3B NVFP4 on Triton (vLLM backend), native /generate API.
    # Same Triton server as text_embedding + cross_reranker below.
    base-url: ${TRITON_LLM_BASE_URL:http://localhost:8000}
    model-name: nemotron
    max-tokens: 2048
    temperature: 0.0        # greedy; #15 A/B on M3 hp x20: t=0.1 5/20 multi-variant answers, t=0.0 3/20
    enable-thinking: false  # empty <think></think> block in the chat template
    timeout-seconds: 120

orchestrator:
  agent:
    max-retries: 1   # regenerate once when the judge rejects an AGENT answer (#16); 0 = off

# =========================
# OpenAI-compatible
# =========================
openai:
  base-url: http://localhost:8001
  api:
    key: ${OPENAI_API_KEY:}
  model: cyankiwi/Qwen3-30B-A3B-Instruct-2507-AWQ-4bit

# =========================
# OpenAI-Real
# =========================
#openai:
#  base-url: https://api.openai.com
#  api:
#    key: ${OPENAI_API_KEY}
#  model: gpt-4o-mini

# =========================
# Claude
# =========================
claude:
  base-url: https://api.anthropic.com
  api:
    key: ${ANTHROPIC_API_KEY:}
  model: claude-sonnet-4-6

# =========================
# Ollama
# =========================
ollama:
  base-url: http://localhost:11434
  model: llama3.1
  embedding:
    model: nomic-embed-text

# =========================
# Judge: vllm, openai, claude, halo
# =========================
judge:
  # halo   = gpt-oss-120b on the GN100 (always reasons; thorough-only, no cascade)
  # triton = Nemotron-3-Nano-30B on the 5090 Triton (fast + thorough modes -> cascade)
  # A/B without editing this file: set JUDGE_PROVIDER=triton in the IntelliJ run config.
  provider: ${JUDGE_PROVIDER:halo}
  # Cascade (JudgeService): fast judge + NumbersCheck; escalate to the thorough judge when the fast judge
  # passes but a number in the answer is not in the context, or its output is unusable/inconsistent.
  # Only active for providers with a fast mode (triton). Validated with scripts/judge-compare (2026-11-01).
  cascade:
    enabled: true
    verify-fast-rejects: false   # true = also re-check fast REJECTs with the thorough judge (0 false rejects seen)
  thorough-attempts: 2           # thorough judge tries (unusable output / verdict-score conflict) before UNAVAILABLE
  triton:
    base-url: ${TRITON_LLM_BASE_URL:http://localhost:8000}
    model-name: nemotron
    fast-max-tokens: 512         # reasoning off: verdict JSON only
    thorough-max-tokens: 3072    # reasoning on: 1024 cut reasoning off on hard cases, 3072 never did
    temperature: 0.1
    connect-timeout-seconds: 5
    read-timeout-seconds: 60
  debug:
    enabled: true          # exposes POST /api/judge/test (dev only)
  halo:
    # GN100 (NVIDIA GB10) via direct 10G link, llama.cpp llama-server
    base-url: ${HALO_BASE_URL:http://192.168.50.20:18002/v1}
    # Rollback to AMD Halo (Lemonade): http://localhost:18002/api/v1
    model: ${HALO_JUDGE_MODEL:gpt-oss-120b-Q4_K_M}
    api-key: ${HALO_API_KEY:}
    reasoning-effort: low  # low | medium | high (gpt-oss "Reasoning:" system line)
    temperature: 0.1
    max-tokens: 1024       # reasoning tokens count against this
    connect-timeout-seconds: 5
    read-timeout-seconds: 90

# =========================
# Triton embedding + reranker
# =========================
embedding:
  provider: triton
  triton:
    base-url: http://localhost:8000
    # text_embedding = bge-base-en-v1.5 (768, symmetric)  -> send-input-type: false
    # nemotron_embed = Nemotron 3.5 Embed 1B (2048, query:/passage: prompts) -> send-input-type: true
    # Switching models changes the vector size: migrate the pgvector columns and re-ingest.
    model-name: ${EMBEDDING_MODEL:nemotron_embed}
    send-input-type: ${EMBEDDING_SEND_INPUT_TYPE:true}

reranker:
  triton:
    base-url: http://localhost:8000
    model-name: cross_reranker

# =========================
# Retrieval tuning
# =========================
vehicle:
  search:
    summary-top-k: 10
    detail-top-k: 5
    hybrid-vector-weight: 0.7
    max-chunks-per-vehicle: 0   # 0 = disabled; cap=3 hurt precision (0.53 -> 0.22), pending spread-triggered version
    # Fleet-search vector floor: cheap pre-filter, depends on the embedding model (bge-base needed 0.50).
    # Nemotron 2048: real queries >= 0.25. Set below that with margin; the rerank gate does the real filtering.
    min-vector-score: 0.20
    min-keyword-score: 0.2
    # Relevance gate: reranker | llm | off. The LLM gate said relevant=true for every query, nonsense included.
    # Rerank gate = best bge-reranker-base score over the top N hits (sigmoid, 0..1). Calibration 2026-10-30:
    #   passing real queries 0.138 - 0.9998 | 'xyzabc vehicle' 0.0027 | failing vague queries 0.0067 (track days), 0.0148 (gas/year)
    min-rerank-score: 0.01
    rerank-gate-top-n: 5

  bulk:
    page-size: 50
    embed-batch-size: 32

# =========================
# LOGGING (🔥 CLEAN RAG ONLY)
# =========================
logging:
  level:
    root: INFO

    # 🔥 YOUR APP (focus here)
    com.example.airagassistant: INFO
    com.example.airagassistant.router: DEBUG
    com.example.airagassistant.rag: DEBUG
    com.example.airagassistant.agent: DEBUG
    com.example.airagassistant.agentic: DEBUG
    com.example.airagassistant.eval: DEBUG
    com.example.airagassistant.judge: DEBUG

    # ❌ Disable SQL noise
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.springframework.jdbc.core: OFF
    org.springframework.jdbc.datasource: OFF
    org.springframework.orm.jpa: OFF