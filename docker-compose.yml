services:
  postgres:
    image: paradedb/paradedb:0.19.11-pg16
    container_name: ai-rag-postgres
    restart: always
    environment:
      POSTGRES_DB: ai_rag_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  triton:
    image: triton-embed:local
    container_name: triton
    restart: always
    ports:
      - "8000:8000"
      - "8002:8002"
    volumes:
      - C:\triton-model-repo:/models
    runtime: nvidia
    command:
      - "tritonserver"
      - "--model-repository=/models"

  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: always
    depends_on:
      - postgres
      - triton
    ports:
      - "8001:8000"
    volumes:
      - C:\Users\Madhu\.cache\huggingface:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN}
    runtime: nvidia
    # Qwen3-30B-A3B Instruct 2507, 4-bit AWQ (MoE: ~30B total / ~3B active per token).
    # ~17 GiB weights; 0.80 leaves ~5.5 GiB for Triton + Windows on the 32 GiB 5090.
    # AWQ format is auto-detected, so no --quantization flag.
    # Rollback: model "meta-llama/Meta-Llama-3.1-8B-Instruct", 0.75, 8192,
    #           "--quantization" "fp8", tool parser "llama3_json".
    command:
      - "cyankiwi/Qwen3-30B-A3B-Instruct-2507-AWQ-4bit"
      - "--gpu-memory-utilization"
      - "0.80"
      - "--max-model-len"
      - "32768"
      - "--enable-prefix-caching"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"

volumes:
  postgres_data: